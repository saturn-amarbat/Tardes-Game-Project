name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Format, Lint & Rojo Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned toolchain via Rokit
        uses: paradoxum-games/setup-rokit@29e6ee09651a3711e3a287a1037671d7b74db6d0 # v3
        with:
          version: "1.2.0"
          cache: true
          token: ${{ github.token }}

      - name: Check toolchain versions
        run: |
          stylua --version
          selene --version
          rojo --version

      - name: Check formatting (StyLua)
        run: stylua --check src

      - name: Lint Luau (Selene)
        run: selene src

      - name: Validate Rojo project builds
        run: |
          rojo build default.project.json -o "$RUNNER_TEMP/default.rbxl"
          rojo build lobby.project.json -o "$RUNNER_TEMP/lobby.rbxl"
          rojo build forest-preview.project.json -o "$RUNNER_TEMP/forest-preview.rbxl"
